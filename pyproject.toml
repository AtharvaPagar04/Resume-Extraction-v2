[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "resume-pdf-raw"
version = "0.1.0"
description = "Deterministic PDF to compact RAW resume JSON extraction"
requires-python = ">=3.10"
dependencies = ["pymupdf>=1.24.0"]

[project.optional-dependencies]
test = ["pytest>=8.0.0"]

[project.scripts]
resume-extract = "resume_extractor.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
